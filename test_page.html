<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CleanSpeak test page</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; }
  textarea, input, #rich { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; margin: 6px 0 18px; }
  #rich { min-height: 80px; border: 1px solid #888; border-radius: 4px; }
  textarea { height: 80px; }
  code { background: #eee; padding: 2px 5px; border-radius: 3px; }
</style>
</head>
<body>
<h2>CleanSpeak test page</h2>
<p>Paste a sentence into each box, then click the blue <b>C</b> button or press <code>Alt+Shift+C</code>.</p>
<p>Try: <code>bro i is gonna go there, its lit af</code> &nbsp; or &nbsp; <code>tbh he's a clown, idk why u trust him</code></p>

<label>1. textarea (button should appear)</label>
<textarea placeholder="textarea"></textarea>

<label>2. text input (button should appear)</label>
<input type="text" placeholder="text input">

<label>3. contenteditable div, like ChatGPT / Gemini / Notion use (button should appear)</label>
<div id="rich" contenteditable="true"></div>

<label>4. password field (NO button should appear)</label>
<input type="password" placeholder="password">

<label>5. read-only box (NO button should appear)</label>
<input type="text" value="read only text" readonly>
</body>
</html>
